    <!-- Подключение Tailwind CSS через локальный файл с CDN-резервом -->
    <script src="./src/tailwind.min.js"></script>
    <script>
        (function(){
            const tw = document.querySelector('script[src="./src/tailwind.min.js"]');
            if (tw) {
                tw.onerror = function() {
                    const cdnScript = document.createElement('script');
                    cdnScript.src = 'https://cdn.tailwindcss.com';
                    document.head.appendChild(cdnScript);
                };
            } else {
                // Local script not present — try CDN immediately
                const cdnScript = document.createElement('script');
                cdnScript.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(cdnScript);
            }
        })();
    </script>
    
    <!-- Подключение FontAwesome через локальный файл с CDN-резервом -->
    <link rel="stylesheet" href="./src/fontawesome/css/all.min.css">
    <script>
        (function(){
            const fa = document.querySelector('link[href="./src/fontawesome/css/all.min.css"]');
            if (fa) {
                fa.onerror = function() {
                    const cdnLink = document.createElement('link');
                    cdnLink.rel = 'stylesheet';
                    cdnLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css';
                    document.head.appendChild(cdnLink);
                };
            } else {
                const cdnLink = document.createElement('link');
                cdnLink.rel = 'stylesheet';
                cdnLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css';
                document.head.appendChild(cdnLink);
            }
        })();
    </script>
