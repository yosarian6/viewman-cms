      id: "bio",
      title: "Bio",
      contentMaxWidth: "1200px",
      hideTitle: false,
      hideSidebar: false,
      seo: {
        title: "Ilia Pilipenko Biography",
        description: "Detailed biography and creative journey of documentary photographer Ilia Pilipenko.",
        keywords: "biography, photographer, curator, Ilia Pilipenko"
      },
      contentHtml: "<h1>Heading H1</h1>\n<h2>Heading H2</h2>\n<h3>Heading H3</h3>\n<p><strong>Ilia Pilipenko</strong> – photographer and curator whose works explore the interaction of humans with their environment and the transformation of urban landscapes. Born in 1985 in Kyiv, Ilia showed an early interest in visual arts and photography as a means of documenting and interpreting reality.</p>\n<p>His early projects focused on abandoned industrial zones and their hidden beauty. Over time, his approach evolved to include a deeper reflection on social dynamics and everyday life.</p>\n<p><strong>Bullet List:</strong></p>\n<ul>\n<li>List item one</li>\n<li>List item two</li>\n<li>List item three, which is very long and should wrap to multiple lines to test formatting and line spacing.</li>\n</ul>\n<p><strong>Numbered List:</strong></p>\n<ol>\n<li>First item</li>\n<li>Second item</li>\n<li>Third item, also long for testing.<br><br></li>\n</ol>\n<div class=\"video-container\">\n<div class=\"video-container\"><iframe width=\"\" height=\"\" src=\"https://www.youtube.com/embed/JyOWiLBVFWg\" frameborder=\"0\" allowfullscreen=\"allowfullscreen\" loading=\"lazy\"></iframe></div>\nIlia is a co-founder and former editor-in-chief of the project <a href=\"https://monogoroda.closeuprussia.com/en/\" target=\"_blank\" rel=\"noopener noreferrer\">“Invisible Cities”</a>, aimed at documenting life in small and medium-sized cities of the post-Soviet space. This project gained recognition for its unique perspective on provincial Russia and its inhabitants.</div>\n<p>In parallel with his photography practice, Ilia is actively engaged in curatorial activities. He is the author of the popular Telegram channel <a href=\"https://t.me/photoexperience\" target=\"_blank\" rel=\"noopener noreferrer\">“Photography Experience”</a>, where he shares analytical articles, reviews, and photography tips, as well as curates exhibitions of young talents.</p>\n<p>In 2022, Ilia co-founded the online gallery <a href=\"https://galleryf11.com/en/\" target=\"_blank\" rel=\"noopener noreferrer\">F11</a>, a platform for showcasing and selling works by contemporary photographers.</p>\n<p>Ilia Pilipenko’s works have been exhibited in various galleries and museums and published in international publications. He continues his creative and research activities, constantly seeking new forms of expression and ways to engage with the audience.</p>\n<p>For collaboration proposals or inquiries about works, please contact via email:&nbsp;<a href=\"mailto:ilpilipenko@gmail.com\">ilpilipenko@gmail.com</a></p>\n<p><video width=\"300\" height=\"150\" controls=\"controls\" src=\"pictures/text_content_images/example_text_video_1.mp4\" alt=\"Example video in text content\"></video></p>\n<p>-- New formatting examples --</p>\n<blockquote>This is my favorite quote that inspires me every day. It looks great in this new style.</blockquote>\n<p>Here I can showcase two of my works side by side.</p>\n[gallery:gallery2]\n<p>And here’s how a gallery of three images looks.<br><br><br></p>\n[gallery:gallery6]\n<p>Finally, here you can watch one of my videos.</p>\n<div class=\"video-container\"><iframe width=\"560\" height=\"315\" title=\"Calamity Cat\" src=\"https://video.lono.space/videos/embed/tLJbQKHsVx5aUHBRz63pdu\" frameborder=\"0\" allowfullscreen=\"allowfullscreen\" sandbox=\"allow-same-origin allow-scripts allow-popups allow-forms\"></iframe></div>\n<div class=\"video-container\"><br><br></div>",

        {
          id: "block_1772644860641_pyqfd",
          type: "paragraph",
          editorX: 66.5,

          editorWidth: 1061,

          frontendY: 8.1026,
          frontendWidth: 88.4167,
          frontendHeight: 137.75,
          rotation: 0.0151202,
          zIndex: 2,
          data: "<p style=\"text-align: left;\"><b>Tuva, a republic <font color=\"#2b647b\"><span style=\"text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial; font-weight: 500;\">in Siberia</span></font>, is a land without railways and, until recently, without mobile phones. A place that seems almost mythical, it came into existence due to a geographical error.</b></p><p style=\"text-align: left;\"></p><ol><li style=\"text-align: left;\"><span style=\"background-color: transparent; font-family: inherit;\"><strike>This error</strike> occurred in <b>1727 </b>during the <font color=\"#cc2424\">signing</font> of the Treaty of Bura (Burinsky Border Treaty). Russia marked its boundary along the Sayan Mountains, while China claimed territory up to the Tannu-Ola range.&nbsp;</span></li><li><span style=\"font-family: inherit; background-color: transparent;\">As a result, a neutral zone spanning several hundred square kilometers was unintentionally created.</span></li></ol><p></p><p><b><i></i></b><a href=\"https://www.youtube.com/watch?v=Dz8r1W6vB9A\" target=\"_blank\" rel=\"noopener noreferrer\">It was only</a><b style=\"\"><i> in 1921, under Soviet auspices, that Red Army troops entered Tuva—then known as a “no man’s land.” This led to the proclamation of a people’s republic in the heart of Asia, </i></b><i>marking the bir</i>th of the first independent Tuvan state — the Land of the Red Shamans.</p><p>Today, this enigmatic republic is often mentioned in connection with Russia’s Minister of Emergency Situations — a distinguished native of Tuva — whose appointment is sometimes seen as a way to tame the destructive forces of nature and spirits alike. After all, who could be better suited for such a role than someone from a land where shamanism still holds official recognition?</p><p>Shaman Saylyk-ool, religious adviser to the president of Tuva, mutters cryptic phrases as he waves burning juniper branches around my head. The pungent smell of smoldering grass mixes with the sour scent of fermented dairy — the base for Arak, the local alcoholic drink used both for pleasure and ritual. The combination produces a mild dizziness, making conversation feel strangely revelatory.</p><p>The shaman’s home — his “reception room” — is an experience in itself. A massive painting by a local artist,&nbsp;<i>The Shaman’s Ritual, or the Rite of Fire</i>, dominates one wall. Nearby hangs a portrait of the Dalai Lama, seemingly torn from a Chinese calendar. Along the walls, mounted on wooden brackets, is an “exhibit” of animal skulls — familiar and unfamiliar — their jaws open, their teeth unnervingly intact.</p><p>At the center of the room stands a grand wooden chair covered in deerskin, its armrests carved into snarling wolf heads. From this throne-like seat, the shaman receives visitors. He speaks in Russian.</p><p>Now it is my turn.</p><p>“The absence of faith is your faith,” Saylyk-ool begins, feeding incense into the burner. “That is not atheism. Atheism is also faith — faith in godlessness, faith against God. I speak of something else. There was a time when God was present in your churches and the spirit lived in every person. Now you believe in nothing.</p><p>You don’t believe the plane you fly will land safely, that the train won’t derail, that the car won’t fall into the abyss. You don’t believe in the spirits of things. And because you don’t believe, you are afraid. Fear is the absence of faith. Disaster will come when the last of you stops believing that the Moon and the Sun will rise.”</p><p>He rolls his eyes upward, waving the incense as if addressing not me but some lost soul.</p><p>“The plane I flew in and the car I drove hardly inspire confidence — let alone faith,” I reply. “The mountains Roerich admired are beautiful, yes — but not divine. The forces of nature are more often destructive than sacred. Your words may hold truth, but only within this room, surrounded by skulls and smoke. Isn’t there something else people believe in — something more tangible?”</p><p>“Human principles are always the same: soul, birth, and death,” he answers.</p><p>“A person can lose his shadow — the ‘gray soul’ that connects him to other spirits. When that happens, the spirits take away the ‘main soul’ — the essence. A man who has lost his essence may continue living, but not for long.</p><p>A person must live where he was born. That is where he must die. This cycle is determined by Nature. Homeland gives strength. Every two years I return to the Mountain of the Yellow Lion — the place of my birth. It is sacred. There I speak with the spirits and ask for strength. Then I pass that strength on to others.”</p><p>Saylyk-ool was born<font color=\"#d31d1d\"> in 1947 into the family of the heredit</font>ary shaman Sadu Pasha. Not every descendant becomes a shaman. One may be chosen by the community, or recognized by an elder through signs.</p><p>Saylyk-ool bore such a sign: as a child, his skull was covered with strange lumps and sores, which remain to this day. They were said to have appeared after his grandfather — also a shaman — touched his head and declared:</p>",

          contentHtml: {
            value: "Заголовок H1\nЗаголовок H2\nЗаголовок H3\nИлья Пилипенко — фотограф и куратор, чьи работы исследуют взаимодействие человека с окружающей средой и трансформацию городских пейзажей. Родился в 1985 году в Киеве, Илья рано проявил интерес к визуальному искусству и фотографии как способу документирования и интерпретации реальности.\nЕго ранние проекты были сосредоточены на заброшенных промышленных зонах и их скрытой красоте. Со временем его подход изменился, включив в себя более глубокое осмысление социальных процессов и повседневной жизни.\nМаркированный список:\n\nПервый пункт списка\nВторой пункт списка\nТретий пункт списка, который очень длинный и должен переноситься на несколько строк для проверки форматирования и межстрочного интервала.\n\nНумерованный список:\n\nПервый пункт\nВторой пункт\nТретий пункт, также длинный для тестирования.\n\n\n\n\n\n\n\n\n\nИлья — сооснователь и бывший главный редактор проекта «Невидимые города», направленного на документирование жизни в малых и средних городах постсоветского пространства. Этот проект получил признание за свой уникальный взгляд на провинциальную Россию и её жителей.\nПараллельно с фотографической практикой Илья активно занимается кураторской деятельностью. Он является автором популярного Telegram-канала «Photography Experience», где делится аналитическими статьями, обзорами и советами по фотографии, а также курирует выставки молодых талантов.\nВ 2022 году Илья стал сооснователем онлайн-галереи F11 — платформы для демонстрации и продажи работ современных фотографов.\nРаботы Ильи Пилипенко экспонировались в различных галереях и музеях, а также публиковались в международных изданиях. Он продолжает свою творческую и исследовательскую деятельность, постоянно находясь в поиске новых форм выражения и способов взаимодействия со зрителем.\nПо вопросам сотрудничества или приобретения работ, пожалуйста, связывайтесь по электронной почте: ilpilipenko@gmail.com\n\n\n\n-- Новые примеры форматирования --\nЭто моя любимая цитата, которая вдохновляет меня каждый день. Она отлично смотрится в этом новом стиле.\nЗдесь я могу продемонстрировать две свои работы бок о бок.\n[gallery:gallery2]\nА вот как выглядит галерея из трёх изображений.\n[gallery:gallery6]\nНаконец, здесь вы можете посмотреть одно из моих видео.\n\n",

              data: {
                value: "Тыва, республика в Сибири, — это земля без железных дорог и, до недавнего времени, без мобильных телефонов. Место, кажущееся почти мифическим, возникло из-за географической ошибки.Эта ошибка произошла в 1727 году во время подписания Буринского договора (Буринского пограничного трактата). Россия провела свою границу по Саянским горам, в то время как Китай заявил претензии на тему вплоть до хребта Танну-Ола. В результате непреднамеренно возникла нейтральная зона площадью в несколько сотен квадратных километров.Лишь в 1921 году под эгидой СССР войска Красной Армии вошли в Тыву, известную тогда как «ничья земля». Это привело к провозглашению народной республики в самом сердце Азии, ознаменовав рождение первого независимого тувинского государства — Земли Красных Шаманов.Сегодня эта загадочная республика часто упоминается в связи с министром по чрезвычайным ситуациям России — выдающимся уроженцем Тывы, чьё назначение иногда рассматривается как способ укротить разрушительные силы как природы, так и духов. В конце концов, кто мог бы лучше подойти на такую роль, чем человек из земли, где шаманизм до сих пор имеет официальное признание?Шаман Сайлык-оол, религиозный советник президента Тывы, бормочет загадочные фразы, размахивая над моей головой горящими ветками можжевельника. Едкий запах тлеющей травы смешивается с кислым ароматом ферментированных молочных продуктов — основы для араки, местного алкогольного напитка, используемого как для удовольствия, так и для ритуалов. Это сочетание вызывает лёгкое головокружение, отчего разговор кажется странно откровенным.Дом шамана — его «приёмная» — это отдельное впечатление. На одной из стен доминирует массивная картина местного художника «Ритуал шамана, или Обряд огня». Рядом висит портрет Далай-ламы, будто вырванный из китайского календаря. Вдоль стен на деревянных кронштейнах размещена «экспозиция» черепов животных — знакомых и незнакомых — с раскрытыми пастями и пугающе целыми зубами.В центре комнаты стоит величественное деревянное кресло, обтянутое оленьей шкурой, его подлокотники вырезаны в виде оскаленных волчьих голов. С этого похожего на трон сиденья шаман принимает посетителей. Он говорит по-русски.Теперь моя очередь.«Отсутствие веры — это ваша вера, — начинает Сайлык-оол, подбрасывая благовония в курильницу. — Это не атеизм. Атеизм — это тоже вера: вера в безбожие, вера против Бога. Я говорю о другом. Было время, когда Бог присутствовал в ваших церквях, а дух жил в каждом человеке. Теперь вы ни во что не верите.Вы не верите, что самолёт, на котором вы летите, благополучно приземлится, что поезд не сойдёт с рельсов, что машина не сорвётся в пропасть. Вы не верите в духов вещей. И поскольку вы не верите, вы боитесь. Страх — это отсутствие веры. Беда придёт тогда, когда последний из вас перестанет верить, что Луна и Солнце взойдут».Он закатывает глаза кверху, размахивая ладаном, словно обращаясь не ко мне, а к какой-то заблудшей душе.«Самолёт, на котором я прилетел, и машина, на которой ехал, вряд ли внушают доверие — не говоря уже о вере, — отвечаю я. — Горы, которыми восхищался Рерих, прекрасны, да, но не божественны. Силы природы чаще бывают разрушительными, чем священными. В ваших словах может быть доля правды, но только в этой комнате, в окружении черепов и дыма. Неужели нет чего-то другого, во что верят люди — чего-то более осязаемого?»«Человеческие принципы всегда одни и те же: душа, рождение и смерть», — отвечает он.«Человек может потерять свою тень — „серую душу“, которая связывает его с другими духами. Когда это происходит, духи забирают „главную душу“ — сущность. Человек, потерявший свою сущность, может продолжать жить, но недолго.Человек должен жить там, где родился. Там же он должен и умереть. Этот цикл предопределён Природой. Родина даёт силы. Каждые два года я возвращаюсь на Гору Жёлтого Льва — место моего рождения. Она священна. Там я разговариваю с духами и прошу силы. Затем я передаю эту силу другим».Сайлык-оол родился в 1947 году в семье потомственного шамана Саду Паши. Не каждый потомок становится шаманом. Кто-то может быть выбран общиной или признан старейшиной по знакам.Сайлык-оол нёс на себе такой знак: в детстве его череп был покрыт странными шишками и язвами, которые остаются и по сей день. Говорили, что они появились после того, как его дедушка — тоже шаман — коснулся его головы и объявил:",

          contentHtml: {
            value: "<h1>Заголовок H1</h1>\n<h2>Заголовок H2</h2>\n<h3>Заголовок H3</h3>\n<p><strong>Илья Пилипенко</strong> – фотограф и куратор, чьи работы исследуют взаимодействие человека с окружающей средой и трансформацию городских ландшафтов. Родился в 1985 году в Киеве, Илья рано проявил интерес к визуальным искусствам и фотографии как средству документирования и интерпретации реальности.</p>\n<p>Его ранние проекты были сосредоточены на заброшенных промышленных зонах и их скрытой красоте. Со временем его подход эволюционировал, включив более глубокую рефлексию о социальных динамиках и повседневной жизни.</p>\n<p><strong>Маркированный список:</strong></p>\n<ul>\n<li>Пункт списка один</li>\n<li>Пункт списка два</li>\n<li>Пункт списка три, который очень длинный и должен переноситься на несколько строк, чтобы проверить форматирование и межстрочный интервал.</li>\n</ul>\n<p><strong>Нумерованный список:</strong></p>\n<ol>\n<li>Первый пункт</li>\n<li>Второй пункт</li>\n<li>Третий пункт, также длинный для тестирования.<br><br>\n<div class='video-container'><iframe src='https://www.youtube.com/embed/JyOWiLBVFWg' frameborder='0' allowfullscreen='allowfullscreen' loading='lazy'></iframe></div>\n</li>\n</ol>\n<p>Илья — соучредитель и бывший главный редактор проекта <a href='https://monogoroda.closeuprussia.com/en/' target='_blank' rel='noopener noreferrer'>«Невидимые города»</a>, направленного на документирование жизни в малых и средних городах постсоветского пространства. Этот проект получил признание за уникальный взгляд на провинциальную Россию и её жителей.</p>\n<p>Параллельно с фотографической практикой Илья активно занимается кураторской деятельностью. Он автор популярного Telegram-канала <a href='https://t.me/photoexperience' target='_blank' rel='noopener noreferrer'>«Photography Experience»</a>, где делится аналитическими статьями, обзорами и советами по фотографии, а также курирует выставки молодых талантов.</p>\n<p>В 2022 году Илья стал соучредителем онлайн-галереи <a href='https://galleryf11.com/en/' target='_blank' rel='noopener noreferrer'>F11</a> — платформы для показа и продажи работ современных фотографов.</p>\n<p>Работы Ильи Пилипенко выставлялись в различных галереях и музеях и публиковались в международных изданиях. Он продолжает свою творческую и исследовательскую деятельность, постоянно ища новые формы выражения и способы взаимодействия с аудиторией.</p>\n<p>По вопросам сотрудничества или запросам о работах обращайтесь по электронной почте:&nbsp;<a href='mailto:ilpilipenko@gmail.com'>ilpilipenko@gmail.com</a></p>\n<p><img src='pictures/gallery1_images/02.jpg' alt='Пример изображения в текстовом контенте'></p>\n<p><img src='pictures/gallery1_images/06.jpg' alt='Пример изображения в текстовом контенте'></p>\n<p><video width='300' height='150' controls='controls' src='pictures/text_content_images/example_text_video_1.mp4' alt='Пример видео в текстовом контенте'></video></p>\n<p>-- Новые примеры форматирования --</p>\n<blockquote>Это моя любимая цитата, которая вдохновляет меня каждый день. Она отлично смотрится в этом новом стиле.</blockquote>\n<p>Здесь я могу показать две свои работы рядом.</p>\n[gallery:gallery2]\n<p>А вот как выглядит галерея из трёх изображений.</p>\n[gallery:gallery6]\n<p>Наконец, здесь вы можете посмотреть одно из моих видео.</p>\n<div class='video-container'><iframe width='560' height='315' title='Calamity Cat' src='https://video.lono.space/videos/embed/tLJbQKHsVx5aUHBRz63pdu' frameborder='0' allowfullscreen='allowfullscreen' sandbox='allow-same-origin allow-scripts allow-popups allow-forms'></iframe></div>\n<p><img src='blob:http://localhost:8000/c01d5ef7-f7d2-4ae5-9c19-eb15f11f26a8' width='544' height='286' alt='' style='float: right;'></p>",

            value: "<p>Это <strong>дополнительная текстовая страница</strong>, которую можно использовать для размещения резюме, контактов, списка публикаций или любой другой информации.</p>\n<p>Как и в разделе «Биография», здесь можно использовать <em>HTML-теги</em> для форматирования текста, добавления <strong>ссылок</strong> и так далее.</p>\n<p>Экспериментируйте с контентом, чтобы максимально эффективно использовать этот функционал для вашего портфолио!</p>\n<p style='text-align: left;'><a href='https://collection.closeuprussia.com/index.php/Detail/objects/cur-202504122209-496' class='button' target='_blank' rel='noopener noreferrer'>Купить на Авито</a></p>\n[gallery:gallery6]\n<p style='text-align: left;'><a href='https://collection.closeuprussia.com/index.php/Detail/objects/cur-202504122209-496' class='button_secondary' target='_blank' rel='noopener noreferrer'>ТЕСТ&nbsp;</a></p>\n<p style='text-align: left;'></p>\n<p style='text-align: left;'></p>",

        zine_1772129484355: {
          title: {
            value: "Новый вебзин",

          },
          seo: {},
          blocks: {
            block_1772644860641_pyqfd: {
              data: {
                value: "<p style='text-align: left;'><b>Тува, республика <font color='#2b647b'><span style='text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial; font-weight: 500;'>в Сибири</span></font>, — земля без железных дорог и до недавнего времени без мобильных телефонов. Место, кажущееся почти мифическим, возникшее из-за географической ошибки.</b></p><p style='text-align: left;'></p><ol><li style='text-align: left;'><span style='background-color: transparent; font-family: inherit;'><strike>Эта ошибка</strike> произошла в <b>1727 </b>году во время <font color='#cc2424'>подписания</font> Буринского договора (Буринский пограничный договор). Россия провела свою границу по Саянским горам, а Китай претендовал на территорию до хребта Танну-Ола.&nbsp;</span></li><li><span style='font-family: inherit; background-color: transparent;'>В результате непреднамеренно была создана нейтральная зона площадью в несколько сотен квадратных километров.</span></li></ol><p></p><p><b><i></i></b><a href='https://www.youtube.com/watch?v=Dz8r1W6vB9A' target='_blank' rel='noopener noreferrer'>Лишь</a><b style=''><i> в 1921 году под советским покровительством войска Красной Армии вошли в Туву — тогда известную как «ничья земля». Это привело к провозглашению народной республики в сердце Азии, </i></b><i>ознаменовав ро</i>ждение первого независимого тувинского государства — Земли Красных Шаманов.</p><p>Сегодня эту загадочную республику часто упоминают в связи с министром по чрезвычайным ситуациям России — выдающимся уроженцем Тувы, — чьё назначение иногда воспринимается как способ усмирить разрушительные силы природы и духов. В конце концов, кто лучше подходит для такой роли, чем человек из земли, где шаманизм до сих пор официально признан?</p><p>Шаман Сайлык-оол, религиозный советник президента Тувы, бормочет загадочные фразы, размахивая горящими ветками можжевельника вокруг моей головы. Резкий запах тлеющей травы смешивается с кислым ароматом кисломолочного продукта — основы араки, местного алкогольного напитка, используемого и для удовольствия, и для ритуалов. Эта комбинация вызывает лёгкое головокружение, делая разговор странно откровенным.</p><p>Дом шамана — его «приёмная» — сам по себе впечатление. Массивная картина местного художника,&nbsp;<i>Ритуал шамана, или Обряд огня</i>, доминирует на одной из стен. Рядом висит портрет Далай-ламы, словно вырванный из китайского календаря. Вдоль стен на деревянных кронштейнах — «экспозиция» черепов животных — знакомых и незнакомых — с открытыми челюстями и пугающе целыми зубами.</p><p>В центре комнаты стоит большое деревянное кресло, покрытое оленьей шкурой, подлокотники которого вырезаны в виде оскаленных волчьих голов. С этого троноподобного сиденья шаман принимает посетителей. Он говорит по-русски.</p><p>Теперь моя очередь.</p><p>«Отсутствие веры — это твоя вера, — начинает Сайлык-оол, подбрасывая благовония в курильницу. — Это не атеизм. Атеизм тоже вера — вера в безбожие, вера против Бога. Я говорю о другом. Было время, когда Бог присутствовал в ваших церквях, а дух жил в каждом человеке. Теперь вы ни во что не верите.</p><p>Вы не верите, что самолёт, на котором летите, благополучно приземлится, что поезд не сойдёт с рельсов, что машина не упадёт в пропасть. Вы не верите в духов вещей. И потому, что не верите, вы боитесь. Страх — это отсутствие веры. Катастрофа наступит, когда последний из вас перестанет верить, что Луна и Солнце взойдут».</p><p>Он закатывает глаза вверх, размахивая благовонием, будто обращается не ко мне, а к какой-то заблудшей душе.</p><p>«Самолёт, на котором я летел, и машина, на которой ехал, едва ли внушают уверенность — не говоря уже о вере, — отвечаю я. — Горы, которыми восхищался Рерих, прекрасны, да — но не божественны. Силы природы чаще разрушительны, чем священны. Ваши слова могут содержать истину, но только в этой комнате, среди черепов и дыма. Разве нет чего-то другого, во что люди верят — чего-то более осязаемого?»</p><p>«Человеческие принципы всегда одни и те же: душа, рождение и смерть», — отвечает он.</p><p>«Человек может потерять свою тень — «серую душу», которая связывает его с другими духами. Когда это происходит, духи забирают «главную душу» — сущность. Человек, потерявший сущность, может продолжать жить, но недолго.</p><p>Человек должен жить там, где родился. Там он должен и умереть. Этот цикл определён Природой. Родина даёт силу. Каждые два года я возвращаюсь к Горе Жёлтого Льва — месту своего рождения. Оно священно. Там я говорю с духами и прошу силы. Затем передаю эту силу другим».</p><p>Сайлык-оол родился<font color='#d31d1d'> в 1947 году в семье потомствен</font>ного шамана Саду Паша. Не каждый потомок становится шаманом. Можно быть выбранным общиной или признанным старцем по знакам.</p><p>Сайлык-оол нёс такой знак: в детстве его череп был покрыт странными шишками и язвами, которые остаются до сих пор. Говорили, что они появились после того, как его дед — тоже шаман — коснулся его головы и объявил:</p>",
